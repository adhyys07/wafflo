<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Picks</title>
    <link rel="stylesheet" href="../css/style1.css">
</head>
<body>
    <div class="container">
        <header class="player-header">
            <h1>Favourite Picks</h1>
        </header>
        <main class="favourite-picks-page">
            <ul class="favourite-songs">
            </ul>
        </main>
    </div>
    <script src="../js/script1.js"></script>
    <script>
        // Load favourite songs from localStorage
        const favouriteSongs = JSON.parse(localStorage.getItem('favouriteSongs')) || [];
        const favouriteSongsList = document.querySelector('.favourite-songs');

        if (favouriteSongs.length === 0) {
            favouriteSongsList.innerHTML = '<li>No favourite songs added yet.</li>';
        } else {
            favouriteSongs.forEach(song => {
                const li = document.createElement('li');
                li.textContent = song.title; // Ensure the title property is accessed correctly
                favouriteSongsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
