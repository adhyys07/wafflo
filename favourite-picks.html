<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Picks</title>
    <style>
        body {
            font-family: 'Courier New', 'Monaco', 'Menlo', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 40px;
        }
        .player-header h1 {
            color: #00ff00;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
        }
        .favourite-picks-page {
            background: #000;
            border: 4px solid #00ff00;
            box-shadow: 0 0 0 2px #000, 0 0 0 4px #00ff00, 10px 10px 0 0 #000, 10px 10px 0 2px #00ff00;
            padding: 40px;
            border-radius: 0;
        }
        .favourite-songs {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .favourite-songs li {
            padding: 12px 20px;
            margin-bottom: 8px;
            background: #111;
            border: 2px solid #00ff41;
            color: #00ff00;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            border-radius: 0;
            box-shadow: 1px 1px 0 0 #000;
            transition: background 0.1s, color 0.1s;
        }
        .favourite-songs li:hover {
            background: #00ff00;
            color: #000;
        }
        @media (max-width: 480px) {
            .player-header h1 {
                font-size: 1.2rem;
            }
            .favourite-picks-page {
                padding: 20px;
            }
            .favourite-songs li {
                font-size: 0.9rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="player-header">
            <h1>Favourite Picks</h1>
        </header>
        <main class="favourite-picks-page">
            <ul class="favourite-songs">
            </ul>
        </main>
    </div>
    <script>
        const favouriteSongs = JSON.parse(localStorage.getItem('favouriteSongs')) || [];
        const favouriteSongsList = document.querySelector('.favourite-songs');

        if (favouriteSongs.length === 0) {
            favouriteSongsList.innerHTML = '<li>No favourite songs added yet.</li>';
        } else {
            favouriteSongs.forEach(song => {
                const li = document.createElement('li');
                li.textContent = song.name || song;
                favouriteSongsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
