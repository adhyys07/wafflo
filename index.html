<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafflo MP3 Player</title>
    <link rel="stylesheet" href="css/style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="music-player">
            <div class="player-header">
                <h1><i class="fas fa-music"></i> Wafflo MP3 Player</h1>
                <div class="favourite-picks">
                    <a href="favourite-picks.html" id="favouritePicksBtn" class="favourite-btn">
                        <i class="fas fa-heart"></i> Favourite Picks
                    </a>
                </div>
            </div>
            
            <div class="album-art">
                <div class="vinyl-effect"></div>
            </div>
            
            <div class="song-info">
                <h2 id="songTitle">No Song Selected</h2>
                <p id="artist">Unknown Artist</p>
            </div>
            
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                    <div id="progressHandle" class="progress-handle"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
            
            <div class="controls">
                <button id="prevBtn" class="control-btn"><i class="fas fa-step-backward"></i></button>
                <button id="playPauseBtn" class="control-btn play-pause"><i class="fas fa-play"></i></button>
                <button id="nextBtn" class="control-btn"><i class="fas fa-step-forward"></i></button>
            </div>
            
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <div class="file-input-container">
                <label for="fileInput" class="file-input-label">
                    <i class="fas fa-folder-open"></i> Choose MP3 Files
                </label>
                <input type="file" id="fileInput" accept="audio/mp3,audio/mpeg" multiple>
            </div>
            
            <div class="playlist" id="playlist">
                <h3>Playlist</h3>
                <ul id="playlistItems"></ul>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="js/script1.js"></script>
    <script>
        document.getElementById('favouritePicksBtn').addEventListener('click', () => {
            const currentSong = document.getElementById('songTitle').textContent;
            const favouriteSongs = JSON.parse(localStorage.getItem('favouriteSongs')) || [];

            if (currentSong && !favouriteSongs.some(song => song.title === currentSong)) {
                favouriteSongs.push({ title: currentSong });
                localStorage.setItem('favouriteSongs', JSON.stringify(favouriteSongs));
            }
        });

        document.querySelectorAll('.heart-btn').forEach(button => {
            button.addEventListener('click', (event) => {
                const songName = event.target.closest('li').querySelector('.song-name').textContent;
                const favouriteSongs = JSON.parse(localStorage.getItem('favouriteSongs')) || [];

                if (songName && !favouriteSongs.some(song => song.title === songName)) {
                    favouriteSongs.push({ title: songName });
                    localStorage.setItem('favouriteSongs', JSON.stringify(favouriteSongs));
                }
            });
        });
    </script>
</body>
</html>
